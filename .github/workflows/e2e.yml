name: E2E Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Run lint
      run: npm run lint

    - name: Run unit tests
      run: npm test

    - name: Build production bundle
      run: npm run build

    - name: Run QA agent
      run: npm run qa:agent

    - name: Run E2E tests
      run: npm run test:e2e -- --reporter=line
      env:
        CI: true

    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        if-no-files-found: ignore
        retention-days: 30

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results/
        if-no-files-found: ignore
        retention-days: 30

    - name: Upload Defect Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qa-report
        path: qa-report.md
        if-no-files-found: ignore
        retention-days: 30
